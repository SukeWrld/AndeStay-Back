# ==================== APLICACIÓN ====================
spring.application.name=ms-andesstay-reservations

# ==================== BASE DE DATOS (H2) ====================
spring.datasource.url=jdbc:h2:mem:andesstay_reservations;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==================== SEGURIDAD (JWT Azure AD) ====================
# Reemplaza <TU_TENANT_ID> por tu Directory (tenant) ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/<TU_TENANT_ID>/v2.0

# Opcional (recomendado):
# spring.security.oauth2.resourceserver.jwt.audiences=api://<TU_API_CLIENT_ID>

# ==================== SERVIDOR ====================
server.port=8081

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info