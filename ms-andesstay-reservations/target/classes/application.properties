spring.application.name=ms-andesstay-reservations
server.port=8081
rabbitmq.url=${RABBITMQ_URL:amqp://andesstay:andesstay_local@localhost:5672/%2F}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/andesstay}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include=health,info
