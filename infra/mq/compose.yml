name: andesstay-mq

services:
  rabbitmq1:
    image: rabbitmq:4.1-management
    hostname: rabbitmq1
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-andesstay-local-dev-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-andesstay_local}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - andesstay

  rabbitmq2:
    image: rabbitmq:4.1-management
    hostname: rabbitmq2
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-andesstay-local-dev-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-andesstay_local}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - andesstay

volumes:
  rabbitmq1_data:
  rabbitmq2_data:

networks:
  andesstay:
    name: andesstay-network
    external: true
