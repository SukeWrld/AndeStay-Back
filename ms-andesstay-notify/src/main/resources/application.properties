spring.application.name=ms-andesstay-notify
server.port=8086
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:andesstay}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:andesstay_local}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
andesstay.notifications.from=${ANDESSTAY_MAIL_FROM:}
andesstay.notifications.housekeeping-webhook-url=${ANDESSTAY_HOUSEKEEPING_WEBHOOK_URL:}
management.endpoints.web.exposure.include=health,info
