spring.application.name=ms-andesstay-report
server.port=8085
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/andesstay}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.group-id=andesstay-report
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
andesstay.kafka.reservations-topic=reservations.events
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:}
management.endpoints.web.exposure.include=health,info
